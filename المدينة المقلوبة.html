:root {
  --ink: #4A3341; --paper: #FFF7EA; --cream: #FFF1DC; --apricot: #F6A97E; --apricot-deep: #C9653E;
  --mint: #94D4BB; --mint-deep: #2F7F63; --violet: #9C89D4; --violet-deep: #6650A6; --bar: rgba(255, 249, 238, 0.92);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #FFF9EF; color: var(--ink); overflow: hidden;
  font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; background: #FFF9EF; }
#stage { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .55s ease, visibility 0s linear .55s; }
.scene.active { opacity: 1; visibility: visible; transition: opacity .55s ease, visibility 0s; }
.world-svg { width: 100%; height: 100%; display: block; }
.clock-num { font: 700 17px 'Readex Pro', sans-serif; fill: var(--ink); }
.lens-word { font: 700 24px 'Readex Pro', sans-serif; fill: #A38E9A; }
.lens-word.on { fill: var(--ink); }
.sign-text { font: 600 25px 'Readex Pro', sans-serif; fill: var(--ink); }
.card-word { font: 700 64px 'Readex Pro', sans-serif; fill: var(--ink); }
.card-small { font: 600 22px 'Readex Pro', sans-serif; fill: #7B6070; }
.bubble-text { font: 700 34px 'Readex Pro', sans-serif; fill: var(--ink); direction: rtl; }
#grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .07; background-size: 220px 220px; }

/* not-yet-built screens (sample only) */
.scene.pending { display: grid; place-items: center; background: var(--paper); }
.pending-card { text-align: center; padding: 2.4rem 3rem; border: 3px dashed #D9C3A6; border-radius: 28px; max-width: min(90vw, 640px); }
.pending-card h2 { margin: .4rem 0 .6rem; font-size: clamp(1.6rem, 3.4vw, 2.6rem); }
.pending-card p { margin: 0; color: #7B6070; font-size: clamp(1rem, 1.6vw, 1.25rem); line-height: 1.8; }
.pending-no { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; background: var(--mint); font-weight: 700; font-size: 1.4rem; }

/* start gate */
#gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 246, 232, .35); z-index: 20; transition: opacity .5s ease, visibility 0s linear .5s; }
#gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate-card { text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 34px; padding: clamp(1.4rem, 4vw, 2.6rem) clamp(1.6rem, 6vw, 4rem);
  box-shadow: 0 10px 0 rgba(74, 51, 65, .12); max-width: 92vw; }
.gate-kicker { margin: 0; color: var(--apricot-deep); font-weight: 600; font-size: clamp(.95rem, 1.6vw, 1.15rem); }
#gate-title { margin: .3rem 0 1.2rem; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.25; }
#gate-btn { font: 700 clamp(1.2rem, 2.4vw, 1.6rem) 'Readex Pro', sans-serif; color: var(--paper); background: var(--violet-deep); border: 3px solid var(--ink);
  border-radius: 999px; padding: .55em 1.8em; cursor: pointer; box-shadow: 0 5px 0 var(--ink); }
#gate-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
#gate-btn:focus-visible { outline: 4px solid var(--apricot); outline-offset: 4px; }
.gate-hint { margin: 1.1rem 0 0; font-size: clamp(.85rem, 1.4vw, 1rem); color: #7B6070; }

/* controls: one compact bar, fades out while the story plays */
.controls { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bar); border: 2px solid rgba(74, 51, 65, .35); border-radius: 999px;
  box-shadow: 0 4px 14px rgba(74, 51, 65, .12); transition: opacity .4s ease; direction: rtl; }
body:not(.running) .controls { opacity: 0; pointer-events: none; }
body.idle .controls { opacity: 0; }
body.idle { cursor: none; }
.controls button { font: 600 15px 'Readex Pro', sans-serif; color: var(--ink); background: transparent; border: 0; border-radius: 999px;
  min-height: 40px; min-width: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.controls button:hover { background: rgba(156, 137, 212, .18); }
.controls button:focus-visible { outline: 3px solid var(--violet-deep); outline-offset: 1px; }
.controls button:disabled { opacity: .35; cursor: default; background: transparent; }
.controls svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#counter { font-weight: 600; font-size: 15px; min-width: 3.4em; text-align: center; }
.sep { width: 2px; height: 24px; background: rgba(74, 51, 65, .2); margin: 0 2px; }
#mute .x { display: none; } #mute.on .x { display: inline; } #mute.on .wave { display: none; }
#fs .exit { display: none; } #fs.on .exit { display: inline; } #fs.on .enter { display: none; }
#vol { width: 92px; accent-color: var(--violet-deep); }
#toast { position: absolute; top: 18px; left: 50%; transform: translate(-50%, -20px); background: var(--ink); color: var(--paper); padding: .6em 1.2em; border-radius: 14px;
  font-size: 16px; opacity: 0; transition: opacity .3s, transform .3s; z-index: 30; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 640px) {
  .controls button span { display: none; }
  #vol { width: 64px; }
  .controls { gap: 2px; padding: 4px 6px; }
}
body.still .controls { display: none; }
.rm .scene, .rm .scene.active, .rm #gate { transition-duration: .2s; }

</style>

  // ================= TALA: costume & hair =================

  TALA.hairBack = function (hg, t) {

      wing.setAttribute('transform', `translate(0,-4) scale(1,${(1 - 1.6 * Math.abs(Math.sin(t * 10)) * amb).toFixed(3)}) translate(0,4)`);
    } };
  }
  function floatLeaf(parent) {

  // ---------------- bridge (screen 3): an upside-down stone bridge ----------------
  function bridge(parent, P1, P2, top, gy) {
    const b = g(parent, { class: 'bridge' });
    const S = T.PAL.stone;
    const qy = (x, y0, yc) => { const u = (x - P1) / (P2 - P1); return (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * yc + u * u * y0; };
    for (const px of [P1, P2]) {
      groundShadow(b, px + 8, gy + 4, 70, 9, 0.3);
      const blocks = (inner) => { for (let y = top + 30, r = 0; y < gy; y += 34, r++) { line(inner, `M${px - 40},${y} H${px + 40}`, S.line, 1.4, { opacity: 0.3 }); line(inner, `M${px + (r % 2 ? -8 : 14)},${y} V${y + 34}`, S.line, 1.4, { opacity: 0.3 }); } };
      part(b, `M${px - 38},${gy} L${px - 34},${top} L${px + 34},${top} L${px + 38},${gy}Z`, S, { line: 3.2, pattern: blocks, shade: [`M${px + 12},${top} L${px + 34},${top} L${px + 38},${gy} L${px + 16},${gy}Z`], light: [`M${px - 30},${top + 10} L${px - 22},${top + 10} L${px - 24},${gy - 10} L${px - 32},${gy - 10}Z`] });
      part(b, rr(px - 48, top - 22, 96, 26, 8), T.PAL.lilac, { line: 2.8, shade: [rr(px - 48, top - 10, 96, 14, 6)] });
      part(b, rr(px - 48, gy - 24, 96, 26, 8), T.PAL.lilac, { line: 2.8, shade: [rr(px - 48, gy - 12, 96, 14, 6)] });
    }
    const n = 18, topE = [], botE = [];
    for (let i = 0; i <= n; i++) { const x = P1 + (P2 - P1) * i / n; topE.push([x, qy(x, top, top + 130)]); botE.push([x, qy(x, top + 64, top + 196)]); }
    const span = A.spline(topE, false, 0.6) + A.spline(botE.slice().reverse(), false, 0.6).replace(/^M/, 'L') + 'Z';
    part(b, span, S, { line: 3.2, pattern: (inner) => { for (let i = 1; i < n; i++) line(inner, `M${f(topE[i][0])},${f(topE[i][1])} L${f(botE[i][0])},${f(botE[i][1])}`, S.line, 1.6, { opacity: 0.35 }); },
      shade: [A.spline(botE.map(([x, y]) => [x, y - 18]), false, 0.6) + A.spline(botE.slice().reverse(), false, 0.6).replace(/^M/, 'L') + 'Z'] });
    // the road deck faces DOWN: railing posts and lamps hang underneath
    for (let i = 1; i < n; i++) { const [x, y] = botE[i]; line(b, `M${f(x)},${f(y)} V${f(y + 34)}`, '#5B3A50', 4); }
    line(b, A.spline(botE.slice(1, n).map(([x, y]) => [x, y + 34]), false, 0.6), '#5B3A50', 8);
    line(b, A.spline(botE.slice(1, n).map(([x, y]) => [x, y + 34]), false, 0.6), T.PAL.lilac.base, 4);
    for (const lx of [P1 + (P2 - P1) * 0.28, P1 + (P2 - P1) * 0.72]) {
      const ly = qy(lx, top + 64, top + 196);
      line(b, `M${f(lx)},${f(ly)} V${f(ly + 46)}`, '#5B3A50', 4.4);
      el('ellipse', { cx: f(lx), cy: f(ly + 70), rx: 26, ry: 16, fill: radial(b, [[0, '#FFF2C0', 0.9], [1, '#FFF2C0', 0]]) }, b);
      part(b, `M${f(lx - 14)},${f(ly + 46)} H${f(lx + 14)} L${f(lx + 9)},${f(ly + 68)} H${f(lx - 9)}Z`, T.PAL.lemon, { line: 2.4 });
    }
    return b;
  }

  // ---------------- chest (screen 5) ----------------
  function chest(parent, x, base) {
    const b = g(parent);
    const W = 130, H = 80;
    groundShadow(b, x, base + 3, 84, 10, 0.32);
    const wood = T.PAL.wood, metal = tone('#E9B949', { shade: '#C8922E', light: '#FFE08A', line: '#7A5212' });
    const inside = el('path', { d: `M${x - W / 2 + 6},${base - H} L${x - W / 2 + 18},${base - H - 22} L${x + W / 2 - 18},${base - H - 22} L${x + W / 2 - 6},${base - H}Z`, fill: '#3E2430', opacity: 0 }, b);
    const note = g(b, { opacity: 0 });
    part(note, rr(-36, -26, 72, 52, 5), tone('#FFFBF0', { line: '#9C8A7A', shade: '#EFE3CF' }), { line: 2.2, shade: ['M0,-26 L36,-26 L36,26 L0,26Z'] });
    line(note, 'M0,-26 V26', '#C8B8A6', 1.6);
    for (const y of [-12, 0, 12]) { line(note, `M-28,${y} q5,-3 10,0 q5,3 10,0`, '#B9A898', 1.6); line(note, `M6,${y} q5,-3 10,0 q5,3 12,0`, '#B9A898', 1.6); }
    part(b, rr(x - W / 2, base - H, W, H, 10), wood, { line: 3.2, shade: [rr(x + W / 2 - 36, base - H, 36, H, 10)], light: [rr(x - W / 2 + 6, base - H + 8, 10, H - 20, 5)],
      pattern: (inner) => { for (const y of [base - H + 28, base - H + 54]) line(inner, `M${x - W / 2},${y} H${x + W / 2}`, wood.line, 1.4, { opacity: 0.35 }); } });
    for (const bx of [x - W / 2 + 20, x + W / 2 - 30]) part(b, rr(bx, base - H, 12, H, 3), metal, { line: 2, weight: false });
    part(b, rr(x - 13, base - H + 10, 26, 28, 6), metal, { line: 2.2 });
    part(b, `M${x - 3},${base - H + 20} a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 M${x - 1.6},${base - H + 22} h3.2 v8 h-3.2Z`, tone('#4A3346'), { line: 0, weight: false });
    const lid = g(b);
    part(lid, `M${-W / 2 - 4},0 C${-W / 2 - 4},-34 ${-W / 3},-42 0,-42 C${W / 3},-42 ${W / 2 + 4},-34 ${W / 2 + 4},0Z`, wood, { line: 3.2, shade: [`M${W / 2 - 34},-40 C${W / 2},-34 ${W / 2 + 4},-20 ${W / 2 + 4},0 L${W / 2 - 30},0Z`], light: [`M${-W / 2 + 6},-6 C${-W / 2 + 8},-26 ${-W / 4},-34 ${-W / 8},-36 C${-W / 4},-30 ${-W / 2 + 18},-22 ${-W / 2 + 14},-6Z`] });
    for (const bx of [-W / 2 + 20, W / 2 - 30]) part(lid, `M${bx},0 V-36 C${bx + 4},-38 ${bx + 8},-38 ${bx + 12},-36 V0Z`, metal, { line: 2, weight: false });
    return { set(open, rise) {
      const a = open * Math.PI * 0.62;
      lid.setAttribute('transform', `translate(${x},${base - H}) scale(1,${Math.cos(a).toFixed(3)})`);
      inside.setAttribute('opacity', Math.min(1, open * 2).toFixed(2));
      note.setAttribute('opacity', Math.min(1, rise * 3).toFixed(2));
      note.setAttribute('transform', `translate(${f(x + rise * 4)},${f(base - H - 6 - rise * 110)}) rotate(${(-8 + rise * 12).toFixed(1)}) scale(${(0.45 + rise * 0.75).toFixed(3)})`);
    } };
  }

  // ---------------- confetti ----------------
  function confetti(parent, x, y) {
    const c = g(parent, { opacity: 0 }), bits = [];
    const cols = ['#FF8FA8', '#FFD66B', '#79D6BC', '#9B86E0', '#FF9A86', '#8FD3F0'];
    for (let i = 0; i < 70; i++) {
      const sh = i % 3 === 0 ? 'M-5,-3 H5 V3 H-5Z' : i % 3 === 1 ? 'M0,-5 C4,-5 5,-1 5,0 C5,4 1,5 0,5 C-4,5 -5,1 -5,0 C-5,-4 -1,-5 0,-5Z' : 'M-6,-2 C-2,-6 2,2 6,-2 L6,2 C2,6 -2,-2 -6,2Z';
      const p = el('path', { d: sh, fill: cols[i % cols.length], stroke: mix(cols[i % cols.length], '#3A2133', 0.4), 'stroke-width': 1 }, c);
      const r = ((i * 9301 + 49297) % 233280) / 233280, r2 = ((i * 4271 + 1031) % 9973) / 9973;
      bits.push({ p, vx: (r - 0.5) * 900, vy: -520 - r2 * 520, spin: (r2 - 0.5) * 900, delay: (i % 10) * 0.04 });
    }
    return { set(t) {
      if (t <= 0 || t > 5.5) { c.setAttribute('opacity', 0); return; }
      c.setAttribute('opacity', Math.min(1, (5.5 - t) / 1.2).toFixed(2));
      for (const b of bits) {
        const tt = Math.max(0, t - b.delay);
        const px = x + b.vx * tt * 0.7 + Math.sin(tt * 4 + b.spin) * 18, py = y + b.vy * tt + 620 * tt * tt;
        b.p.setAttribute('transform', `translate(${f(px)},${f(Math.min(py, 1000))}) rotate(${f(b.spin * tt)})`);
      }
    } };
  }

  window.Kit2 = { live, blink, girl, breathe, garden, tree, magicDoor, butterfly, bird, floatLeaf, bridge, chest, confetti };
})();

<script>
/* «عالم بالمقلوب» v2 — quality sample in the approved character style.
   Camera shots (one focal point each):
     0–7     wide: the whole upside-down street; doors on top open for a peek; Jana points, Tala laughs
     7–13    wide, tilting up a little: two cars fly in; a fish swims across the sky
     13–20.5 medium on the cat and dog: the cat barks (15 s), silence, the dog meows (19 s)
     20.5–25 medium on the girls: they look at each other and laugh
     25–31.5 close on the clock: the hands run backwards (25.6–30 s)
     31.5–   wide again; the town settles into quiet life (blinks, breathing, fish, clouds)
   No text anywhere on screen. All state is a function of scene time t → clean replay on re-entry. */
(function () {
  'use strict';
  const D = window.Draw, A = window.Art, T = window.Town2, Cst = window.Cast, An = window.Animals;
  const { K, S, pulse } = D;
  const { el, g } = A;

  const H0 = 1.0, C0 = 7.4, A0 = 13.6, BARK = 15.0, MEOW = 19.0, LOOK = 20.5, K0 = 24.8, SPIN0 = 25.6, SPIN1 = 30.0, Z0 = 31.5;
  const CORE = { x: 110, y: 40, w: 1480, h: 830 };
  const TX = 1442, JX = 1222, FEET = 864, SC = 1.16;
  const CAT = [736, 704], DOG = [1004, 706];

  // camera shots: [cx, cy, zoom]
  const WIDE = [800, 450, 1], UP = [800, 420, 1.04], ANIM = [870, 588, 1.85], GIRLS = [1332, 556, 1.6], CLOCK = [1090, 238, 2.1];
  const camKeys = [[0, WIDE], [6.6, [790, 450, 1.03], 'sine'], [7.6, UP], [12.6, UP], [13.8, ANIM], [20.2, ANIM], [21.2, GIRLS], [24.6, GIRLS], [25.6, CLOCK], [31.0, CLOCK], [32.4, WIDE]];

  // a figure that is rebuilt only when its pose actually changes
  function live(parent, draw) {
    const wrap = g(parent);
    let key = '', node = null;
    return {
      wrap,
      set(P, extra) {
        const k = JSON.stringify(P, (n, v) => typeof v === 'number' ? Math.round(v * 2) / 2 : v);
        if (k !== key) {
          const nn = g(wrap); nn.__defs = el('defs', {}, nn);
          draw(nn, P);
          if (node) node.remove();
          node = nn; key = k;
        }
        wrap.setAttribute('transform', extra || '');
      },
    };
  }
  const blink = (t, off, per) => ((t + off) % per) < 0.13;

  function build(section) {
    const svg = el('svg', { class: 'world-svg', viewBox: '0 0 1600 900', preserveAspectRatio: 'xMidYMid meet', role: 'img',
      'aria-label': 'مدينة مقلوبة: بيوت واقفة على سقوفها وأبوابها في الأعلى، سيارتان تطيران، قطة تنبح وكلب يموء، وساعة تدور عقاربها بالعكس، وتالا وجنى تتفرجان' }, section);
    const cam = g(svg);
    // ----- background (pale, simple)
    T.sky(cam);
    const clouds = [T.cloud(g(cam), 520, 120, 210), T.cloud(g(cam), 1330, 92, 170), T.cloud(g(cam), 900, 190, 130)];
    T.farSkyline(cam);
    T.ground(cam);
    // ----- middle (the action)
    const hA = T.house(cam, { x: 300, w: 236, h: 250, rh: 92, wall: T.PAL.coral, roof: T.PAL.lilac, door: T.PAL.lilac, ladder: true, cols: 2, curtain: T.PAL.lemon, box: T.PAL.mint });
    const hB = T.house(cam, { x: 610, w: 168, h: 330, rh: 70, wall: T.PAL.mint, roof: T.PAL.lemon, door: T.PAL.coral, cols: 2, rows: 2, winW: 42, dw: 50, curtain: T.PAL.coral, box: T.PAL.coral });
    const tw = T.tower(cam, 1090);
    const sky2 = g(cam, { display: 'none' });   // the fish were removed at the owner's request
    const fishA = T.fish(sky2, A.tone('#FF9F5A', { shade: '#E57A3A', light: '#FFC796', line: '#9A4A20' }));
    const fishB = T.fish(sky2, A.tone('#8FD3F0', { shade: '#5DB3DD', light: '#C9ECFA', line: '#2F6E92' }));
    const carsL = g(cam);
    const car1 = T.car(carsL, T.PAL.lilac), car2 = T.car(carsL, T.PAL.coral);
    const animals = g(cam);
    const cat = live(animals, (n, P) => An.cat(n, P));
    const dog = live(animals, (n, P) => An.dog(n, P));
    const catMarks = T.soundMarks(cam, 1), dogMarks = T.soundMarks(cam, -1);
    // ----- foreground (the girls)
    const kids = g(cam);
    const tala = live(kids, (n, P) => Cst.figure(n, Cst.TALA, P));
    const jana = live(kids, (n, P) => Cst.figure(n, Cst.JANA, P));

    function update(t) {
      const rm = D.isReduced(), amb = rm ? 0 : 1;
      // camera
      const [cx, cy, z] = K(t, camKeys);
      cam.setAttribute('transform', `translate(800,450) scale(${z.toFixed(4)}) translate(${(-cx).toFixed(2)},${(-cy).toFixed(2)})`);
      clouds.forEach((c, i) => c.setAttribute('transform', `translate(${(Math.sin(t * 0.04 + i * 2) * 18 * amb).toFixed(1)},0)`));
      // doors on top swing open for a peek, then close
      for (const [h, a, b] of [[hA, H0 + 1.0, H0 + 4.4], [hB, H0 + 1.8, H0 + 5.0]]) {
        const o = K(t, [[a, 0], [a + 0.7, 1, 'out'], [b, 1], [b + 0.7, 0]]);
        h.leaf.setAttribute('transform', `translate(${h.hinge},0) scale(${(1 - o * 0.8).toFixed(3)},1) translate(${-h.hinge},0)`);
      }
      // flying cars: enter, then hover gently
      const x1 = K(t, [[C0, 2200], [C0 + 4, 918, 'out']]) + 24 * Math.sin(0.4 * t) * amb * (t > C0 + 4 ? 1 : 0);
      const x2 = K(t, [[C0 + 1.2, -700], [C0 + 5.4, 430, 'out']]) + 18 * Math.sin(0.33 * t + 1) * amb * (t > C0 + 5.4 ? 1 : 0);
      const y1 = 318 + 7 * Math.sin(1.2 * t) * amb, y2 = 200 + 6 * Math.sin(1.0 * t + 2) * amb;
      car1.root.setAttribute('transform', `translate(${x1.toFixed(1)},${y1.toFixed(1)}) rotate(${(Math.sin(1.2 * t) * 1.5 * amb).toFixed(2)})`);
      car2.root.setAttribute('transform', `translate(${x2.toFixed(1)},${y2.toFixed(1)}) scale(-0.82,0.82) rotate(${(Math.sin(t + 2) * 1.5 * amb).toFixed(2)})`);
      car1.shadow.setAttribute('transform', `translate(${x1.toFixed(1)},762) scale(${(0.9 + 0.04 * Math.sin(1.2 * t) * amb).toFixed(3)},1)`);
      car2.shadow.setAttribute('transform', `translate(${x2.toFixed(1)},756) scale(0.7,0.7)`);
      const spin = (t * 150 * amb) % 360;
      [car1, car2].forEach((c, ci) => {
        c.wheels.forEach((w) => w.setAttribute('transform', `rotate(${spin.toFixed(1)})`));
        c.puffs.forEach((p, i) => { const ph = (t * 0.7 + i / 3 + ci * 0.2) % 1; p.setAttribute('opacity', (amb ? (1 - ph) * 0.9 : 0.7).toFixed(2)); p.setAttribute('transform', `translate(${(ph * 26 * amb).toFixed(1)},0)`); });
      });
      // fish swimming through the sky (slow; wraps far off-screen)
      const fxA = rm ? 980 : 2000 - ((t * 38 + 900) % 2900), fxB = rm ? 380 : 2100 - ((t * 26 + 2200) % 2900);
      fishA.root.setAttribute('transform', `translate(${fxA.toFixed(1)},${(150 + 10 * Math.sin(t * 0.9) * amb).toFixed(1)}) scale(1.1)`);
      fishB.root.setAttribute('transform', `translate(${fxB.toFixed(1)},${(238 + 8 * Math.sin(t * 0.7 + 1) * amb).toFixed(1)}) scale(0.85)`);
      [fishA, fishB].forEach((fh, i) => fh.tail.setAttribute('transform', `rotate(${(Math.sin(t * 6 + i) * 14 * amb).toFixed(1)} 26 0)`));
      // clock runs backwards
      let minute, hour;
      if (rm) { const st = Math.max(0, Math.min(9, Math.floor((t - SPIN0) / 0.45) + 1)); minute = -30 * st; hour = 60 - st * 2.5; }
      else { minute = K(t, [[SPIN0, 0], [SPIN1, -720, 'io']]) - Math.max(0, t - SPIN1) * 3; hour = K(t, [[SPIN0, 60], [SPIN1, 0, 'io']]) - Math.max(0, t - SPIN1) * 0.25; }
      tw.minute.setAttribute('transform', `rotate(${minute.toFixed(2)})`);
      tw.hour.setAttribute('transform', `rotate(${hour.toFixed(2)})`);

      // ----- the cat (barks) and the dog (meows)
      const catOpen = Math.max(pulse(t, BARK, BARK + 0.2, 0.04), pulse(t, BARK + 0.3, BARK + 0.5, 0.04)) > 0.3;
      const dogOpen = t > MEOW && t < MEOW + 1.15;
      const catP = { s: 1.3, mouth: catOpen ? 'wide' : 'closed',
        eyes: t > MEOW + 0.6 && t < MEOW + 5 ? 'wide' : (blink(t, 0.7, 5.3) ? 'happy' : 'open'),
        tilt: K(t, [[BARK - 0.4, 0], [BARK - 0.1, -8], [BARK + 0.8, -4], [BARK + 1.4, 0], [MEOW + 0.6, 0], [MEOW + 1.1, 14], [MEOW + 5, 14], [MEOW + 5.6, 4]]),
        ear: K(t, [[MEOW + 0.6, 0], [MEOW + 1.1, 1], [MEOW + 5, 1], [MEOW + 5.6, 0]]),
        tail: K(t, [[BARK - 0.2, 0], [BARK + 0.2, 12], [BARK + 2, 12], [BARK + 2.6, 0]]) + Math.round(Math.sin(t * 0.8) * 4 * amb), look: 0.6 };
      cat.set(catP, `translate(${CAT[0]},${CAT[1]}) scale(-1,1)`);          // facing right, toward the dog
      const dogP = { s: 1.28, mouth: dogOpen ? 'wide' : 'closed',
        eyes: dogOpen ? 'happy' : (t > BARK + 0.3 && t < BARK + 3 ? 'wide' : (blink(t, 2.1, 4.7) ? 'happy' : 'open')),
        tilt: K(t, [[BARK + 0.3, 0], [BARK + 0.7, -9], [MEOW - 0.6, -9], [MEOW - 0.1, 6], [MEOW + 0.9, 8], [MEOW + 1.6, 0]]),
        ear: K(t, [[BARK + 0.3, 0], [BARK + 0.6, 1], [BARK + 3, 1], [BARK + 3.6, 0]]),
        tail: t > MEOW + 2.4 && t < MEOW + 6 ? Math.round(Math.sin(t * 7) * 10 * amb) : 0, look: -0.5 };
      dog.set(dogP, `translate(${DOG[0]},${DOG[1]})`);
      catMarks.setAttribute('opacity', K(t, [[BARK - 0.05, 0], [BARK + 0.1, 1], [BARK + 1.2, 1], [BARK + 1.8, 0]]).toFixed(2));
      catMarks.setAttribute('transform', `translate(${CAT[0] + 80},${CAT[1] - 128}) scale(0.85)`);
      dogMarks.setAttribute('opacity', K(t, [[MEOW - 0.05, 0], [MEOW + 0.1, 1], [MEOW + 1.4, 1], [MEOW + 2, 0]]).toFixed(2));
      dogMarks.setAttribute('transform', `translate(${DOG[0] - 92},${DOG[1] - 154}) scale(0.85)`);

      // ----- Tala
      const tP = { s: SC, view: '34', expr: 'happy', look: [-0.6, -0.2] };
      if (t < C0) {
        tP.expr = S(t, [[0, 'happy'], [H0 + 1.4, 'surprised'], [H0 + 2.4, 'laugh'], [H0 + 5.2, 'happy']]);
        if (t > H0 + 2.4 && t < H0 + 5.0) { tP.handR = [-4, -194]; tP.gripR = 'open'; tP.frontR = true; }
      } else if (t < A0) {
        tP.expr = t < C0 + 0.5 ? 'happy' : 'surprised'; tP.look = [-0.3, -1];
        if (t > C0 + 1.0 && t < C0 + 4.4) { tP.handL = [-78, -300]; tP.gripL = 'point'; }
      } else if (t < LOOK) {
        tP.look = [-0.8, 0.6]; tP.expr = S(t, [[A0, 'curious'], [BARK, 'surprised'], [BARK + 1.6, 'curious'], [MEOW, 'surprised']]);
      } else if (t < K0) {
        tP.look = [-0.6, -0.1];                                                // Jana turns to her
        tP.expr = t < LOOK + 0.6 ? 'surprised' : 'laugh';
        if (t > LOOK + 0.6 && t < LOOK + 3.6) { tP.handL = [-12, -194]; tP.gripL = 'open'; tP.frontL = true; }
      } else if (t < Z0) {
        tP.look = [-0.3, -1]; tP.expr = S(t, [[K0, 'thinking'], [SPIN0 + 0.4, 'surprised'], [SPIN1, 'laugh'], [SPIN1 + 1.4, 'happy']]);
      } else {
        const c = Math.floor((t - Z0) / 5) % 3;
        tP.look = [[-0.6, -0.2], [-0.4, -0.2], [-0.3, -1]][c]; tP.expr = 'happy';
      }

<script>

    { id: 'world', title: 'عالم بالمقلوب', impl: window.SceneWorld },
    { id: 'bridge', title: 'الطريق المستحيل', impl: window.SceneBridge },
    { id: 'opposites', title: 'لعبة العكس', impl: window.SceneOpposites },
    { id: 'riddle', title: 'السهم العالق ولغز المفتاح', impl: window.SceneRiddle },
    { id: 'wonder', title: 'قبل أن يُغلق الباب', impl: window.SceneWonder },

    ctx: null, master: null, buffers: {}, bus: null, sources: [], muted: false, volume: 0.8,

    const sec = document.createElement('section');
    sec.className = 'scene'; sec.dataset.id = p.id; sec.setAttribute('aria-hidden', 'true');

        `<p>تُعاد رسمها بالأسلوب الجديد بعد اعتماد عيّنة «عالم بالمقلوب».</p></div>`;

      if (a >= 1600 / 900) { vh = 900; vw = vh * a; vx = 800 - vw / 2; vy = 0; }

    $('#counter').textContent = `${AR(i + 1)} / ${AR(PLAN.length)}`;
    $('#prev').disabled = i === 0; $('#next').disabled = i === PLAN.length - 1;
    $('#live').textContent = `الشاشة ${AR(i + 1)}: ${cur.title}`;

  if (still !== null) { document.getElementById('gate').style.display = 'none'; document.body.classList.add('still'); }
